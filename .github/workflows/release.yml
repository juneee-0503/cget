name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-artifacts:
    name: Build release artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCGET_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-release --parallel

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp build-release/cget dist/
          cp README.md CHANGELOG.md dist/
          tar -czf "cget-${{ github.ref_name }}-${{ runner.os }}.tar.gz" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cget-${{ github.ref_name }}-${{ runner.os }}
          path: cget-${{ github.ref_name }}-${{ runner.os }}.tar.gz
